apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "application-repository-operator.fullname" . }}-controller-manager
  labels:
    control-plane: controller-manager
  {{- include "application-repository-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controllerManager.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: operator
      control-plane: controller-manager
    {{- include "application-repository-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: operator
        control-plane: controller-manager
      {{- include "application-repository-operator.selectorLabels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      containers:
      - args: {{- toYaml .Values.controllerManager.manager.args | nindent 8 }}
        command:
        - /manager
        env:
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: {{ quote .Values.kubernetesClusterDomain }}
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: argocd-write-token
              key: token
        {{- if .Values.github.repoOwner }}
        - name: ARGOCD_REPO_OWNER
          value: {{ quote .Values.github.repoOwner }}
        {{- end }}
        {{- if .Values.github.repoName }}
        - name: ARGOCD_REPO_NAME
          value: {{ quote .Values.github.repoName }}
        {{- end }}
        {{- if .Values.github.repoBranch }}
        - name: ARGOCD_REPO_BRANCH
          value: {{ quote .Values.github.repoBranch }}
        {{- end }}
        image: {{ .Values.controllerManager.manager.image.repository }}:{{ .Values.controllerManager.manager.image.tag
          | default .Chart.AppVersion }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources: {{- toYaml .Values.controllerManager.manager.resources | nindent 10
          }}
        securityContext: {{- toYaml .Values.controllerManager.manager.containerSecurityContext
          | nindent 10 }}
      nodeSelector: {{- toYaml .Values.controllerManager.nodeSelector | nindent 8 }}
      securityContext: {{- toYaml .Values.controllerManager.podSecurityContext | nindent
        8 }}
      serviceAccountName: {{ include "application-repository-operator.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      tolerations: {{- toYaml .Values.controllerManager.tolerations | nindent 8 }}
      topologySpreadConstraints: {{- toYaml .Values.controllerManager.topologySpreadConstraints
        | nindent 8 }}
