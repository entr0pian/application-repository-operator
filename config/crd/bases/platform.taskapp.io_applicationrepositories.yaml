---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: applicationrepositories.platform.taskapp.io
spec:
  group: platform.taskapp.io
  names:
    kind: ApplicationRepository
    listKind: ApplicationRepositoryList
    plural: applicationrepositories
    singular: applicationrepository
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repoURL
      name: RepoURL
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ApplicationRepository is the Schema for the applicationrepositories
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ApplicationRepository
            properties:
              chartPath:
                default: chart
                description: chartPath is the path within repoURL where the Helm chart
                  lives.
                type: string
              clusters:
                description: |-
                  clusters lists every target cluster/environment this repository should
                  be delivered to. Sync is always automated (prune + selfHeal) for now.
                items:
                  description: ClusterTarget describes one cluster/environment this
                    repository is delivered to.
                  properties:
                    imageTag:
                      description: |-
                        imageTag pins the image tag deployed to this cluster, forwarded as an
                        image.tag Helm parameter to the onboarded repo's chart. Clearing it
                        (leaving it empty) reverts this cluster to the chart's own default tag.
                      type: string
                    name:
                      description: |-
                        name is the target environment (e.g. "dev", "prod"). It selects which
                        taskapp-argocd apps/values-<name>.yaml file the operator patches, and
                        therefore also which destinationServer the generated Argo CD Application
                        uses (each values-<env>.yaml already carries the correct destinationServer
                        for every app rendered in that environment).
                      type: string
                    namespace:
                      default: default
                      description: namespace is the destination namespace on the target
                        cluster.
                      type: string
                  required:
                  - name
                  type: object
                minItems: 1
                type: array
              repoURL:
                description: repoURL is the git URL of the application's own repo,
                  containing its Helm chart.
                type: string
              targetRevision:
                default: main
                description: targetRevision is the git branch or tag to track.
                type: string
            required:
            - clusters
            - repoURL
            type: object
          status:
            description: status defines the observed state of ApplicationRepository
            properties:
              clusters:
                description: |-
                  clusters reports, per spec.clusters[] entry, whether the corresponding
                  values-<env>.yaml entry in taskapp-argocd has been committed to match spec.
                items:
                  description: ClusterDeploymentStatus reports the git-commit state
                    for one target cluster.
                  properties:
                    commitSHA:
                      description: commitSHA is the taskapp-argocd commit that last
                        updated this entry.
                      type: string
                    committed:
                      description: committed is true once this cluster's values-<env>.yaml
                        entry matches spec.
                      type: boolean
                    error:
                      description: |-
                        error is the last failure reason, set when committed is false
                        (e.g. retries exhausted after repeated conflicts committing to taskapp-argocd).
                      type: string
                    lastAttempt:
                      description: lastAttempt is when the operator last tried to
                        reconcile this cluster's entry.
                      format: date-time
                      type: string
                    name:
                      description: name is the cluster/environment name from spec.clusters.
                      type: string
                  required:
                  - committed
                  - name
                  type: object
                type: array
              conditions:
                description: |-
                  conditions represent the current state of the ApplicationRepository resource.

                  Condition types used:
                  - "SpecSynced": true once repositories.<name>.{repoURL,targetRevision,chartPath}
                    in taskapp-argocd's apps/values.yaml matches spec.
                  - "Ready": true only when SpecSynced is true and every spec.clusters[] entry
                    shows committed:true in status.clusters[].

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
